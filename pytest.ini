[pytest]
testpaths = tests/direct
# The local pipx venv ships an incompatible `hydra_pytest` / `langsmith`
# plugin that fails to import on Python 3.14 (`typing.io` was removed).
# Disable them so the GenLayer `gltest_direct` plugin can collect cleanly.
# `-p no:<name>` is harmless when the plugin is absent (e.g. in CI).
addopts = -p no:hydra_pytest -p no:langsmith_plugin
